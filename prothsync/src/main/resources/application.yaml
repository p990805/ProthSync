spring:
  application:
    name: ProthSync

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6380
      password: ${REDIS_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY}
  geocoding:
    base-url: https://dapi.kakao.com

logging:
  file:
    name: ${LOG_DIR:./logs}/prothsync.json
  structured:
    format:
      file: logstash
    json:
      add:
        service_name: prothsync
        environment: ${APP_ENV:local}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_DIR:./logs}/archive/prothsync.%d{yyyy-MM-dd}.%i.json.gz
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 1GB
      clean-history-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: prothsync
