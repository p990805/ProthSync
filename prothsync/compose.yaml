services:
  postgres-prothSync:
    image: 'postgres:18'
    container_name: postgres-prothSync
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - prothSync_postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      - db-net

  redis-prothSync:
    image: 'redis:7-alpine'
    container_name: redis-prothSync
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      TZ: ${TZ}
    ports:
      - "6380:6379"
    networks:
      - db-net
    volumes:
      - prothSync_redis_data:/data

  prometheus:
    image: 'prom/prometheus:latest'
    container_name: prometheus-prothSync
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prothSync_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - db-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: 'grafana/loki:3.7.9'
    container_name: loki-prothSync
    command: -config.file=/etc/loki/config.yaml
    restart: unless-stopped
    volumes:
      - ./monitoring/loki/config.yaml:/etc/loki/config.yaml:ro
      - prothSync_loki_data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - db-net

  alloy:
    image: 'grafana/alloy:v1.21.3'
    container_name: alloy-prothSync
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${LOG_DIR:-./logs}:/var/log/prothsync:ro
      - prothSync_alloy_data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    networks:
      - db-net
    depends_on:
      - loki

  grafana:
    image: 'grafana/grafana:latest'
    container_name: grafana-prothSync
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      TZ: ${TZ}
    volumes:
      - prothSync_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./monitoring/grafana/provisioning/dashboards/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./monitoring/grafana/provisioning/dashboards/json:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - db-net
    depends_on:
      - prometheus
      - loki

networks:
  db-net:
    name: db-net

volumes:
  prothSync_postgres_data:
  prothSync_redis_data:
  prothSync_prometheus_data:
  prothSync_grafana_data:
  prothSync_loki_data:
  prothSync_alloy_data:
